[project]
name = "sqlastack-core"
dynamic = ["version"]
description = "Core SQL access layer: config, engine, session factory, exceptions."
readme = "README.md"
authors = [
    {name = "Jens Klein", email = "jk@kleinundpartner.at"},
]
requires-python = ">=3.12"
license = "GPL-2.0-only"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "sqlmodel>=0.0.16,<1.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv"]
zope = ["zope.sqlalchemy>=4.0", "transaction"]
test = [
    "sqlastack-core[zope]",
    "pytest",
    "pytest-cov",
    "testcontainers>=4.0",
    "psycopg[binary]>=3.1",
]
develop = ["sqlastack-core[dotenv,test]", "pdbp"]

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlastack"]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.coverage.run]
parallel = true
source = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
lines-after-imports = 2
no-sections = true
